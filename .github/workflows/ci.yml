name: Threat Hunting Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    name: Offline evidence (Windows/Linux, Python matrix)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile code without live connections
        run: python -m compileall -q huntlab scripts tests
      - name: Verify Markdown and core hunt structure
        run: python scripts/validate_playbooks.py
      - name: Verify canonical KQL in all six core playbooks
        run: python -B scripts/sync_kql_examples.py --check
      - name: Validate KQL syntax and curated vendor schemas
        shell: pwsh
        run: ./scripts/validate_kql_schemas.ps1
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic evidence reports
        run: python scripts/render_reports.py --check
